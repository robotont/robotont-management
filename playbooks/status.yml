---
# Status: command-line check, not a Semaphore task (Grafana takes this role later; notes/05).
# Read-only, every enrolled robot, no inputs. Reports reachability, sudo, robotont.service,
# mainboard, hostname, uptime, disk, deployed stack commits and (container runtime) the active
# stack and its containers. Red only when a robot is unreachable, sudo fails, a submodule is
# missing, or robotont.service is not active; a missing mainboard is reported, not failed.
#
# CLI: ansible-playbook playbooks/status.yml -K
- name: Controller-side checks
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check that the robotont-setup submodules are checked out
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../external/{{ item }}/ansible/robots.yaml"
      register: upstream_playbooks
      loop:
        - robotont-setup
        - robotont-setup-rpi

    - name: Fail early if a submodule is missing
      ansible.builtin.assert:
        that: upstream_playbooks.results | map(attribute='stat.exists') | list is all
        fail_msg: "A submodule under external/ is empty. Run `git submodule update --init` in the repository."
        quiet: true

    - name: Check that the community.general collection is available
      ansible.builtin.command: ansible-galaxy collection list community.general
      register: collection_list
      changed_when: false
      failed_when: "'community.general' not in collection_list.stdout"

- name: Robot status
  hosts: all
  gather_facts: true
  become: true
  vars:
    robotont_ws: "/home/{{ ansible_user }}/ros2_ws"
  tasks:
    - name: Confirm that sudo works
      ansible.builtin.command: id -un
      register: whoami
      changed_when: false
      failed_when: whoami.stdout != 'root'

    - name: Read robotont.service state
      ansible.builtin.command: >-
        systemctl show robotont.service -p ActiveState -p SubState -p NRestarts -p ExecMainStartTimestamp
      register: service_show
      changed_when: false
      failed_when: false

    - name: Read the active stack (container runtime; absent on robots without it)
      ansible.builtin.slurp:
        src: /etc/robotont/stack
      register: stack_file
      failed_when: false

    - name: Determine the runtime mode
      ansible.builtin.set_fact:
        robotont_runtime_deployed: "{{ stack_file.content is defined }}"
        robotont_stack_active: >-
          {{ (stack_file.content | b64decode | trim) if stack_file.content is defined else 'host' }}

    - name: Determine whether containers are expected
      ansible.builtin.set_fact:
        robotont_containers_expected: "{{ robotont_runtime_deployed | bool and robotont_stack_active != 'host' }}"

    - name: Check that the mainboard is enumerated as /dev/robotont
      ansible.builtin.stat:
        path: /dev/robotont
      register: mainboard

    # yamllint disable rule:line-length
    - name: Read the containers of the robotont compose project
      ansible.builtin.command: >-
        docker ps -a --filter label=com.docker.compose.project=robotont
        --format '{% raw %}{{.Names}}|{{.State}}|{{.Status}}|{{.Label "robotont.stack"}}|{{.Label "robotont.devices"}}|{{.Image}}{% endraw %}'
      register: containers
      changed_when: false
      failed_when: false
      when: robotont_containers_expected | bool
    # yamllint enable rule:line-length

    - name: Validate the active stack definition
      ansible.builtin.command: /usr/local/bin/robotont-stack check {{ robotont_stack_active | quote }}
      register: stack_check
      changed_when: false
      failed_when: false
      when: robotont_containers_expected | bool

    - name: Read the commits deployed in the host ROS workspace
      ansible.builtin.command: vcs export --exact
      args:
        chdir: "{{ robotont_ws }}/src"
      become: false               # git refuses peko's repositories when run as root
      register: stack_export
      changed_when: false
      failed_when: false
      when: robotont_stack_active == 'host'

    - name: Read the release and firmware bookkeeping
      ansible.builtin.shell: |
        grep -E '^ROBOTONT_RELEASE=' /etc/robotont/robotont.env 2>/dev/null || true
        cat /etc/robotont/firmware-version 2>/dev/null || true
      register: release_info
      changed_when: false

    - name: Evaluate the container state
      ansible.builtin.set_fact:
        containers_total: >-
          {{ (containers.stdout_lines | default([]) | length) if robotont_containers_expected | bool else 0 }}
        containers_running: >-
          {{ (containers.stdout_lines | default([]) | select('search', '\\|running\\|') | list | length)
             if robotont_containers_expected | bool else 0 }}

    - name: Collect the report
      ansible.builtin.set_fact:
        robotont_status:
          hostname: "{{ ansible_facts.hostname }}"
          expected_hostname: "robotont-{{ id }}"
          uptime_minutes: "{{ (ansible_facts.uptime_seconds | int) // 60 }}"
          root_free_gb: >-
            {{ ((ansible_facts.mounts | selectattr('mount', 'equalto', '/')
                | map(attribute='size_available') | list | sum) / 1073741824) | round(1) }}
          runtime: >-
            {{ ('container runtime, stack ' ~ robotont_stack_active)
               if robotont_runtime_deployed | bool else 'ROS on the host (robotont-setup)' }}
          service: >-
            {{ service_show.stdout_lines if service_show.rc == 0
               else ['systemctl failed: ' ~ (service_show.stderr | default(''))] }}
          containers: >-
            {{ (containers.stdout_lines | default([])) if robotont_containers_expected | bool else 'none expected' }}
          containers_running: "{{ containers_running }}/{{ containers_total }}"
          stack_check: >-
            {{ ((stack_check.stdout_lines | default([])) + (stack_check.stderr_lines | default([])))
               if robotont_containers_expected | bool else 'n/a' }}
          mainboard_present: "{{ mainboard.stat.exists }}"
          release: "{{ release_info.stdout_lines }}"
          stack: >-
            {{ ((stack_export.stdout if (stack_export.rc | default(1)) == 0
                else 'not available: ' ~ (stack_export.stderr | default(stack_export.msg | default('')))))
               if robotont_stack_active == 'host' else 'n/a (container runtime)' }}

    - name: Show the report
      ansible.builtin.debug:
        var: robotont_status

    - name: Fail when robotont.service is not running
      ansible.builtin.assert:
        that:
          - service_show.rc == 0
          - "'ActiveState=active' in service_show.stdout_lines"
          - >-
            not (robotont_containers_expected | bool)
            or (containers_total | int > 0 and containers_running | int == containers_total | int)
          - not (robotont_containers_expected | bool) or stack_check.rc == 0
        fail_msg: >-
          {{ inventory_hostname }}: robotont.service is not active, or the stack containers are not all running.
        quiet: true
