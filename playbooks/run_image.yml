---
# 4. Run image: run any container image on ONE robot as a workspace. Generates
# /srv/robotont/workspaces/<name>/compose.yaml on the robot (one service with the shared Robotont
# settings: host network, ROS environment, optional hardware access), pulls the image as the robot
# user (so a private registry works after `docker login` there), activates the workspace and
# restarts robotont.service. Nothing is written to the repository. Back to the standard bringup
# with "3. Switch workspace" driver; a generated workspace is re-activated by running this again.
#
#   Inputs: robotont_id (Robot number), image (reference, e.g. traefik/whoami:v1.11.0 or
#           ghcr.io/org/app:tag), workspace (Name, optional: default from the image),
#           command (optional: overrides the image command), hardware (no/yes: /dev and the
#           device cgroup rules, declares mainboard,lidar,gamepad)
#   CLI:    ansible-playbook playbooks/run_image.yml -K -e robotont_id=123 -e image=traefik/whoami:v1.11.0
- name: Check the inputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check the robot and the image reference
      ansible.builtin.assert:
        that:
          - robotont_id is defined
          - ('robotont-' ~ robotont_id) in groups['all']
          - image is defined
          - image | string is match('^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,254}$')
        fail_msg: >-
          Needed: robotont_id of an enrolled robot (1. Setup Ubuntu) and image, a reference such as
          traefik/whoami:v1.11.0 or ghcr.io/org/app:tag (no spaces).
        quiet: true

    - name: Derive the workspace name from the image when none was given
      ansible.builtin.set_fact:
        workspace: >-
          {{ (workspace | default('') | trim) if (workspace | default('') | trim | length > 0) else
             (image | regex_replace('@sha256:[0-9a-f]+$', '') | regex_replace(':[^/]+$', '') | basename
              | lower | regex_replace('[^a-z0-9-]', '-') | regex_replace('^-+', '') | truncate(63, true, '', 0)) }}
        hardware: "{{ hardware | default('no') | string | lower in ['true', 'yes'] }}"

    - name: List the workspaces of the repository (their names are reserved)
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../robot/workspaces"
        file_type: directory
        recurse: false
      register: repo_workspaces

    - name: Check the workspace name
      ansible.builtin.assert:
        that:
          - workspace is match('^[a-z0-9][a-z0-9-]{0,62}$')
          - workspace not in (repo_workspaces.files | map(attribute='path') | map('basename') | list)
        fail_msg: >-
          Name '{{ workspace }}' is not usable: use [a-z0-9-], up to 63 characters, and not the name
          of a repository workspace ({{ repo_workspaces.files | map(attribute='path') | map('basename')
          | reject('match', '^_') | sort | join(', ') }}).
        quiet: true

    - name: Put only this robot into the run-time group
      ansible.builtin.add_host:
        name: "robotont-{{ robotont_id }}"
        groups: robots
        workspace: "{{ workspace }}"
        hardware: "{{ hardware }}"

- name: Run the image on the robot
  hosts: robots
  become: true
  vars:
    workspace_wait_seconds: 60
    workspace_dir: "/srv/robotont/workspaces/{{ workspace }}"
  tasks:
    - name: Check that the container runtime is deployed
      ansible.builtin.stat:
        path: /usr/local/bin/robotont-workspace
      register: workspace_tool

    - name: Stop when the runtime is missing
      ansible.builtin.assert:
        that: workspace_tool.stat.exists
        fail_msg: "{{ inventory_hostname }} has no workspaces yet: run 2. Deploy first."
        quiet: true

    - name: Read the currently active workspace
      ansible.builtin.command: /usr/local/bin/robotont-workspace current
      changed_when: false
      register: current_workspace

    - name: Generate and pull the workspace; remove it again when the image cannot be pulled
      block:
        - name: Create {{ workspace_dir }}
          ansible.builtin.file:
            path: "{{ workspace_dir }}"
            state: directory
            mode: "0755"

        - name: Write the compose file
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/robotont_workspaces/templates/image-workspace.compose.yaml.j2"
            dest: "{{ workspace_dir }}/compose.yaml"
            mode: "0644"

        - name: Validate the workspace on the robot
          ansible.builtin.command: /usr/local/bin/robotont-workspace check {{ workspace | quote }}
          become: true
          become_user: "{{ robotont_user }}"
          changed_when: false

        - name: Pull the image as the robot user (the robot needs internet) {{ image }}
          ansible.builtin.command: /usr/local/bin/robotont-workspace pull {{ workspace | quote }}
          become: true
          become_user: "{{ robotont_user }}"
          register: image_pull
          changed_when: "'updated' in image_pull.stdout"
      rescue:
        - name: Remove the generated workspace (keeps the robot as it was)
          ansible.builtin.file:
            path: "{{ workspace_dir }}"
            state: absent
          when: current_workspace.stdout != workspace

        - name: Report the failure
          ansible.builtin.fail:
            msg: >-
              Could not prepare workspace '{{ workspace }}' from {{ image }}; '{{ current_workspace.stdout }}'
              keeps running. {{ ((image_pull.stdout_lines | default([])) + (image_pull.stderr_lines | default([])))
              | map('trim') | reject('equalto', '') | join(' | ') }}

    - name: Show the pull result
      ansible.builtin.debug:
        msg: "{{ image_pull.stdout_lines }}"

    - name: Activate the workspace
      ansible.builtin.copy:
        content: "{{ workspace }}\n"
        dest: /etc/robotont/workspace
        owner: "{{ robotont_user }}"
        group: "{{ robotont_user }}"
        mode: "0644"

    - name: Restart robotont.service with the new workspace
      ansible.builtin.systemd_service:
        name: robotont.service
        state: restarted

    - name: Wait for robotont.service to be active
      ansible.builtin.command: systemctl is-active robotont.service
      register: service_state
      changed_when: false
      failed_when: false
      retries: "{{ (workspace_wait_seconds / 5) | int }}"
      delay: 5
      until: service_state.stdout == 'active'

    - name: Give the container time to start
      ansible.builtin.pause:
        seconds: 15

    - name: Show the runtime status
      ansible.builtin.command: /usr/local/bin/robotont-workspace status
      changed_when: false
      register: workspace_status

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ current_workspace.stdout }} -> {{ workspace }}
          ({{ image }}{{ ', hardware access' if hardware | bool else '' }}).
          Back to the bringup: 3. Switch workspace driver. Re-activate later: 4. Run image with the same name.
          {{ workspace_status.stdout }}
