---
# Restart robotont.service (with daemon-reload) and wait until it is active.
- name: Restart Robotont services
  hosts: robots
  gather_facts: false
  become: true
  tasks:
    - name: Restart robotont.service
      ansible.builtin.systemd_service:
        name: robotont.service
        state: restarted
        daemon_reload: true

    - name: Wait for robotont.service to become active
      ansible.builtin.command: systemctl is-active robotont.service
      register: service_state
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: service_state.stdout == 'active'
