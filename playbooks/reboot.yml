---
# Reboot the robots and wait until robotont.service is active again.
- name: Reboot Robotont
  hosts: robots
  gather_facts: false
  become: true
  tasks:
    - name: Reboot and wait for SSH
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 15
        msg: "Reboot requested by robotont-management"

    - name: Wait for robotont.service to become active
      ansible.builtin.command: systemctl is-active robotont.service
      register: service_state
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: service_state.stdout == 'active'
