---
# 4. Switch preset: activate a preset on ONE robot with the container runtime (docs/07).
#   Inputs: robotont_id (Robot number), preset (host | driver | test-talker | demo-example ...)
#   CLI:    ansible-playbook playbooks/switch_preset.yml -K -e robotont_id=123 -e preset=driver
- name: Select the robot
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check the inputs
      ansible.builtin.assert:
        that:
          - robotont_id is defined
          - ('robotont-' ~ robotont_id) in groups['all']
          - preset is defined
          - preset is match('^[a-z0-9][a-z0-9-]{0,30}$')
        fail_msg: "Needed: robotont_id of an enrolled robot (1. Setup Ubuntu) and preset ([a-z0-9-], max 31 characters)."
        quiet: true

- name: Switch the Robotont preset
  hosts: "robotont-{{ robotont_id | default('none') }}"
  become: true
  vars:
    preset_wait_seconds: 60
  tasks:
    - name: Check that the container runtime is deployed
      ansible.builtin.stat:
        path: /usr/local/bin/robotont-preset
      register: preset_tool

    - name: Stop when the runtime is missing
      ansible.builtin.assert:
        that: preset_tool.stat.exists
        fail_msg: "{{ inventory_hostname }} has no container runtime yet: run playbooks/setup_docker.yml first (docs/08, Part B)."
        quiet: true

    - name: Validate the preset on the robot
      ansible.builtin.command: /usr/local/bin/robotont-preset check {{ preset | quote }}
      become_user: "{{ robotont_user }}"
      changed_when: false

    - name: Read the currently active preset
      ansible.builtin.command: /usr/local/bin/robotont-preset current
      changed_when: false
      register: current_preset

    - name: Write the new preset
      ansible.builtin.copy:
        content: "{{ preset }}\n"
        dest: /etc/robotont/preset
        owner: "{{ robotont_user }}"
        group: "{{ robotont_user }}"
        mode: "0644"

    - name: Restart robotont.service with the new preset
      ansible.builtin.systemd_service:
        name: robotont.service
        state: restarted

    - name: Wait for robotont.service to be active
      ansible.builtin.command: systemctl is-active robotont.service
      register: service_state
      changed_when: false
      failed_when: false
      retries: "{{ (preset_wait_seconds / 5) | int }}"
      delay: 5
      until: service_state.stdout == 'active'

    - name: Give the containers time to start
      ansible.builtin.pause:
        seconds: 15

    - name: Show the runtime status
      ansible.builtin.command: /usr/local/bin/robotont-preset status
      changed_when: false
      register: preset_status

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ current_preset.stdout }} -> {{ preset }}\n{{ preset_status.stdout }}"
