---
# Build the Robotont images on the robots themselves (native architecture, no registry needed).
# 15 to 30 minutes on a NUC, longer on a Raspberry Pi. -e build_student=true also builds the
# student image (Phase D3). Requires network access on the robot (base image, apt, git).
- name: Build Robotont images on the robots
  hosts: robots
  become: true
  become_user: "{{ robotont_user }}"
  vars:
    build_student: false
    build_timeout: 3600
    robotont_ros_image: "{{ robotont_image_repo }}/robotont-ros:{{ robotont_release }}"
  tasks:
    - name: Record the current robotont-ros image id
      ansible.builtin.command: docker image inspect --format '{% raw %}{{.Id}}{% endraw %}' {{ robotont_ros_image }}
      register: image_before
      changed_when: false
      failed_when: false

    - name: Build robotont-ros (this takes a while)
      ansible.builtin.command: >-
        docker compose --env-file /etc/robotont/robotont.env
        -f /opt/robotont/images/compose.build.yaml build robotont-ros
      async: "{{ build_timeout }}"
      poll: 30
      changed_when: false

    - name: Build robotont-student
      ansible.builtin.command: >-
        docker compose --env-file /etc/robotont/robotont.env
        -f /opt/robotont/images/compose.build.yaml --profile student build robotont-student
      async: "{{ build_timeout }}"
      poll: 30
      changed_when: false
      when: build_student | bool

    - name: Record the new robotont-ros image id
      ansible.builtin.command: docker image inspect --format '{% raw %}{{.Id}}{% endraw %}' {{ robotont_ros_image }}
      register: image_after
      changed_when: image_after.stdout != image_before.stdout

    - name: Report
      ansible.builtin.debug:
        msg: "{{ robotont_ros_image }} = {{ image_after.stdout }} ({{ 'rebuilt' if image_after.stdout != image_before.stdout else 'unchanged' }})"
