---
# Test connection: cheap checks that everything a Provision run depends on is in place.
#   1. controller: the robotont-setup submodule is checked out and community.general is installed
#   2. robots: SSH login as peko works (upstream test_connections.yaml)
#   3. robots: privilege escalation works (the sudo credential)

# Runs on the controller, but is attached to the robot hosts so that --limit does not exclude it.
- name: Controller-side checks
  hosts: robots
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Check that the robotont-setup submodules are checked out
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../external/{{ item }}/ansible/robots.yaml"
      register: upstream_playbooks
      delegate_to: localhost
      run_once: true
      loop:
        - robotont-setup
        - robotont-setup-rpi

    - name: Fail early if a submodule is missing
      ansible.builtin.assert:
        that: upstream_playbooks.results | map(attribute='stat.exists') | list is all
        fail_msg: >-
          A submodule under external/ is empty. Run `git submodule update --init` in the repository,
          or see docs/semaphore-setup.md, section "Submodules", for the Semaphore fallbacks.
        quiet: true
      run_once: true

    - name: Check that the community.general collection is available
      ansible.builtin.command: ansible-galaxy collection list community.general
      register: collection_list
      changed_when: false
      failed_when: "'community.general' not in collection_list.stdout"
      delegate_to: localhost
      run_once: true

- import_playbook: ../external/robotont-setup/ansible/test_connections.yaml

- name: Check privilege escalation
  hosts: robots
  gather_facts: false
  become: true
  tasks:
    - name: Run id as root
      ansible.builtin.command: id -un
      register: whoami
      changed_when: false

    - name: Confirm that sudo works
      ansible.builtin.assert:
        that: whoami.stdout == 'root'
        fail_msg: >-
          Privilege escalation failed. Check the sudo credential attached to the inventory in
          Semaphore, or use -K on the command line.
        quiet: true
