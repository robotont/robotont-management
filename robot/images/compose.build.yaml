# Image build definitions. CI (.github/workflows/images.yml) builds the same Dockerfiles and pushes
# them to GHCR; on a robot this file is only the fallback build when a pull is not possible
# (playbooks/deploy.yml, roles/robotont_workspaces). Workspaces reference the images by name, so
# a built and a pulled image are interchangeable.
#
#   docker compose --env-file /etc/robotont/robotont.env -f /srv/robotont/images/compose.build.yaml build robotont-ros
services:
  robotont-ros:
    image: ${ROBOTONT_IMAGE_REPO}/robotont-ros:${ROBOTONT_RELEASE}
    build:
      context: ./robotont-ros
      additional_contexts:
        releases: ../releases            # the pinned release files (robot/releases in the repository)
      args:
        RELEASE: ${ROBOTONT_RELEASE}
        BASE_IMAGE: ${ROBOTONT_BASE_IMAGE:-ros:jazzy-ros-base}

  # Phase D3
  robotont-student:
    image: ${ROBOTONT_IMAGE_REPO}/robotont-student:${ROBOTONT_RELEASE}
    build:
      context: ./robotont-student
      args:
        RELEASE: ${ROBOTONT_RELEASE}
        IMAGE_REPO: ${ROBOTONT_IMAGE_REPO}
    profiles: ["student"]
