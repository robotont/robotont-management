# Workspace "test-talker": hardware-free dummy for testing the unit, switching, logs and metrics on
# a VM or a robot without touching the mainboard. Uses the upstream ROS image only.
services:
  talker:
    image: ros:jazzy-ros-base
    container_name: robotont-talker
    network_mode: host
    ipc: host
    init: true
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID}"
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4     # see _common/services.yaml
    command:
      - ros2
      - topic
      - pub
      - --rate
      - "1"
      - /chatter
      - std_msgs/msg/String
      - "{data: hello from robotont-${ROBOTONT_ID:-0}}"
    labels:
      robotont.workspace: "${ROBOTONT_WORKSPACE:-unknown}"
      robotont.devices: ""
