---
# Deploys /opt/robotont (presets, images, releases), /etc/robotont, the robotont.service that
# replaces the unit from robotont-setup, the sudoers whitelist and the metrics timer.
# The active preset is operational state: written only on the first deploy (robotont_default_preset)
# or when `preset` is passed explicitly (playbooks/switch_preset.yml, Semaphore "3. Switch preset").
- name: Check that the robot user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ robotont_user }}"

- name: Create the runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ robotont_root }}"
    - /etc/robotont

- name: Deploy presets, image definitions and release files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../robot/{{ item }}/"
    dest: "{{ robotont_root }}/{{ item }}/"
    mode: preserve
  loop:
    - presets
    - images
    - releases

- name: Install the robotont command-line tools
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../robot/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
  loop:
    - robotont-preset
    - robotont-metrics
    - robotont-status

- name: Write /etc/robotont/robotont.env
  ansible.builtin.template:
    src: robotont.env.j2
    dest: /etc/robotont/robotont.env
    owner: root
    group: "{{ robotont_user }}"
    mode: "0640"
  notify: Restart robotont

- name: Check whether a preset is already selected
  ansible.builtin.stat:
    path: /etc/robotont/preset
  register: preset_file

- name: Select the preset (first deploy, or explicit switch)
  ansible.builtin.copy:
    content: "{{ preset | default(robotont_default_preset) }}\n"
    dest: /etc/robotont/preset
    owner: "{{ robotont_user }}"
    group: "{{ robotont_user }}"
    mode: "0644"
  when: preset is defined or not preset_file.stat.exists
  notify: Restart robotont

- name: Allow the robot user to control robotont.service without a password
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/robotont-preset
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install robotont.service (replaces the unit installed by robotont-setup)
  ansible.builtin.template:
    src: robotont.service.j2
    dest: /etc/systemd/system/robotont.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart robotont

- name: Remove the legacy unit from robotont-setup
  ansible.builtin.file:
    path: /lib/systemd/system/robotont.service
    state: absent
  notify: Reload systemd

- name: Create /run/robotont now and at every boot
  ansible.builtin.copy:
    content: "d /run/robotont 0755 root root -\n"
    dest: /etc/tmpfiles.d/robotont.conf
    mode: "0644"
  register: tmpfiles

- name: Apply the tmpfiles entry
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/robotont.conf
  when: tmpfiles.changed

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ robotont_textfile_dir }}"
    state: directory
    mode: "0755"

- name: Install the metrics service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - robotont-metrics.service
    - robotont-metrics.timer
  notify:
    - Reload systemd
    - Restart robotont-metrics timer

- name: Apply pending unit changes before enabling
  ansible.builtin.meta: flush_handlers

- name: Enable and start robotont.service and the metrics timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - robotont.service
    - robotont-metrics.timer
