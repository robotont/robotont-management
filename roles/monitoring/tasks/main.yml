---
# node_exporter from Ubuntu's archive, scraped by the Prometheus in server/compose.yaml. Serves
# the host metrics plus the robotont_* textfile written by robotont-metrics (2. Deploy).
- name: Install node_exporter
  ansible.builtin.apt:
    lock_timeout: 600       # a fresh install runs unattended-upgrades for minutes after boot
    name: "{{ monitoring_node_exporter_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the textfile directory (robotont-metrics writes robotont.prom here)
  ansible.builtin.file:
    path: "{{ monitoring_textfile_dir }}"
    state: directory
    mode: "0755"

- name: Configure node_exporter (textfile collector, listen address)
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (roles/monitoring).
      ARGS="--collector.textfile.directory={{ monitoring_textfile_dir }}
            --web.listen-address=:{{ monitoring_node_exporter_port }}"
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Apply a configuration change now
  ansible.builtin.meta: flush_handlers

- name: Check that node_exporter answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_node_exporter_port }}/metrics"
    return_content: false
  register: node_exporter_probe
  retries: 5
  delay: 2
  until: node_exporter_probe.status == 200
