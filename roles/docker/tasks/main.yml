---
# Docker Engine and the Compose plugin from Docker's apt repository (Ubuntu 24.04).
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian      # needed by the deb822_repository module
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker's apt repository (key is downloaded into /etc/apt/keyrings)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg
  register: docker_repo

- name: Refresh the apt cache after adding the repository
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Configure the Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  register: docker_group

# The SSH session that Ansible keeps open still carries the old group list; a new login has the
# new one. Without this, a build in the same run gets "permission denied" on the Docker socket.
- name: Reset the SSH connection so the new group membership applies
  ansible.builtin.meta: reset_connection
