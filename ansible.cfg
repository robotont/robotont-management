[defaults]
inventory = inventory
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False
forks = 10
roles_path = roles
# The upstream robotont-setup roles still resolve next to the imported playbook.

[ssh_connection]
pipelining = True
# -4: robots are reached over IPv4; mDNS also returns IPv6 link-local addresses, which are
# unusable from the Semaphore container. The rest is Ansible's default.
ssh_args = -4 -C -o ControlMaster=auto -o ControlPersist=60s
# Retry a dropped connection instead of failing a 20-minute task on one hiccup (sshd restart,
# address change, mDNS miss).
retries = 5
