# Semaphore for the Robotont fleet, configured automatically.
#
#   cp server/.env.example server/.env    # robot-side values only: SSH key path, sudo password, Wi-Fi
#   docker compose -f server/compose.yaml up -d
#   open http://localhost:3000            # admin / admin
#
# The "bootstrap" service runs once after Semaphore is healthy and creates or updates the project,
# the key store, the repository, the inventory, the environment and the task templates from
# server/.env and server/templates.json (idempotent: run `up -d` again after editing them).
#
# Security model: local machine or the UT private network only. Admin credentials are fixed and
# the key store is not encrypted at rest. Set SEMAPHORE_BIND=0.0.0.0 in .env to serve the LAN
# (it is the bind address of Semaphore, Prometheus and Grafana alike).
# The image tag is pinned; upgrading Semaphore is a deliberate change here, never `latest`.
name: robotont

services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.14
    container_name: robotont-semaphore
    restart: unless-stopped
    ports:
      - "${SEMAPHORE_BIND:-127.0.0.1}:3000:3000"
    environment:
      SEMAPHORE_DB_DIALECT: sqlite          # embedded single-file database under /var/lib/semaphore
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: admin
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      TZ: Europe/Tallinn
    volumes:
      - semaphore_data:/var/lib/semaphore      # database and key store
      - semaphore_config:/etc/semaphore        # config.json generated on first start
      - semaphore_tmp:/tmp/semaphore           # task workspaces
      # Local repository (notes/semaphore-setup.md): this working tree, including the submodules,
      # is used directly. Remove the line when Semaphore clones from GitHub instead.
      - ..:/repositories/robotont-management
    # Robot names: the container's resolver forwards to the Docker host's resolver. On Docker
    # Desktop (macOS) that resolves .local names through mDNS, so no mapping is needed. On Linux
    # (Docker Engine) mDNS is not available in the container: give "1. Setup Ubuntu" the robot's
    # IP address (a DHCP reservation keeps it stable), add extra_hosts here, or use real DNS.
    # The repository is written from the container (enrolment files, Prometheus targets); the
    # bootstrap makes those two directories writable, nothing else is needed on Linux.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  bootstrap:
    image: semaphoreui/semaphore:v2.19.14
    container_name: robotont-semaphore-bootstrap
    depends_on:
      semaphore:
        condition: service_healthy
    restart: "no"
    # Root inside the one-shot bootstrap: on Linux a bind mount keeps the host owner and mode of
    # the 0600 SSH key, which the image's non-root user (uid 1001) cannot read. Docker Desktop on
    # macOS hid this. The bootstrap only reads files and talks to the Semaphore API.
    user: "0:0"
    env_file:
      - path: .env
        required: false        # absent on a checkout that only runs the static checks
    environment:
      SEMAPHORE_URL: http://semaphore:3000
      TEMPLATES_FILE: /bootstrap/templates.json
      WORKSPACES_DIR: /workspaces                    # fills the Workspace dropdown of "3. Switch workspace"
    volumes:
      # The whole server/ directory rather than single files: a file replaced on the host (editor,
      # git) would keep its old content behind a single-file bind mount until the container is recreated.
      - .:/bootstrap:ro
      - ../robot/workspaces:/workspaces:ro
      # The repository itself, read-write: the bootstrap applies patches/ to the submodules.
      - ..:/repositories/robotont-management
      - "${ROBOT_SSH_KEY_FILE:?set ROBOT_SSH_KEY_FILE in server/.env}:/run/secrets/robot_ssh_key:ro"
    entrypoint: ["python3", "/bootstrap/bootstrap.py"]

  # Writes server/networks.json, the IPv4 networks of this machine's interfaces, for the Network
  # dropdown of "0. Find robots" (the bootstrap reads it). Host networking is what makes the
  # interfaces visible; on Docker Desktop that is the VM, whose network the script filters out, so
  # the dropdown there holds only the networks of enrolled robots. Allowed to fail.
  host-networks:
    image: semaphoreui/semaphore:v2.19.14
    container_name: robotont-host-networks
    network_mode: host
    restart: "no"
    user: "0:0"
    volumes:
      - ..:/repositories/robotont-management
    entrypoint: ["python3", "/repositories/robotont-management/scripts/host_networks.py",
                 "/repositories/robotont-management/server/networks.json"]

  # Monitoring (notes/10-monitoring.md): Prometheus scrapes node_exporter on every robot listed in
  # prometheus/targets/robots.json (rendered from inventory/robots/ by the bootstrap and by
  # "1. Setup Ubuntu"); Grafana serves the provisioned "Robotont fleet" dashboard on port 3001.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: robotont-prometheus
    restart: unless-stopped
    ports:
      - "${SEMAPHORE_BIND:-127.0.0.1}:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.5
    container_name: robotont-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "${SEMAPHORE_BIND:-127.0.0.1}:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # anyone on the network may view; admin edits
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/robotont-fleet.json
      TZ: Europe/Tallinn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  semaphore_data:
  semaphore_config:
  semaphore_tmp:
  prometheus_data:
  grafana_data:
