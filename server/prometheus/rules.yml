# Alert rules evaluated by Prometheus; no Alertmanager yet, so they show in Prometheus
# (/alerts) and on the Grafana dashboard, nothing is sent anywhere (notes/10-monitoring.md).
groups:
  - name: robotont-records
    rules:
      # When a robot was last scraped successfully. While it is up this is "now"; while it is
      # down the rule keeps re-emitting its last value ("or" with itself), so the dashboard can
      # show "last seen 3 days ago" for an offline robot. Lost only if Prometheus itself stops
      # for more than 5 minutes.
      - record: robotont_last_seen_timestamp_seconds
        expr: timestamp(up{job="robots"} == 1) or robotont_last_seen_timestamp_seconds
      # Ready to drive: reachable, robotont.service active, mainboard enumerated.
      - record: robotont_ready
        expr: >-
          (up{job="robots"} == 1)
          and on (instance) (robotont_service_active == 1)
          and on (instance) (robotont_device_present{device="mainboard"} == 1)
  - name: robotont
    rules:
      - alert: RobotDown
        expr: up{job="robots"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.robot }} is not reachable by Prometheus"
          description: >-
            No answer from {{ $labels.instance }} for 2 minutes (off, no network, or node_exporter stopped).
      - alert: RobotontServiceInactive
        expr: robotont_service_active == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "robotont.service is not active on {{ $labels.robot }}"
          description: "The active stack is not running (journalctl -u robotont on the robot)."
      - alert: RobotontDeviceMissing
        expr: robotont_container_device == 1 and on (instance, device) robotont_device_present == 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.robot }}: {{ $labels.device }} claimed by {{ $labels.service }} but not present"
          description: >-
            The stack {{ $labels.stack }} needs the {{ $labels.device }}, which is not enumerated
            (unplugged, powered off, or a udev rule problem).
      - alert: RobotontDeviceConflict
        expr: robotont_device_conflict == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.robot }}: {{ $labels.device }} claimed by two running containers"
