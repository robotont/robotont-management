# Prometheus for the Robotont fleet (docs/10-monitoring.md). Robots come from targets/robots.json,
# rendered from inventory/robots/ by scripts/prometheus_targets.py (bootstrap, 1. Setup Ubuntu).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: robots
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
